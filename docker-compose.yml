services:
  app:
    build: .
    container_name: emotion-intent-engine
    ports:
      - "8000:8000"
    environment:
      - USE_TRANSFORMER=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
